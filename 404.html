<style>
  :root {
    --black: #0B0A08; --paper: #F5F1E8; --stone: #8D8574; --champagne: #C4996B;
    --grot: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: ui-serif, "Iowan Old Style", Palatino, Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--black); color: var(--paper); font-family: var(--grot);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 40px; -webkit-font-smoothing: antialiased;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: .34em;
    text-transform: uppercase; color: var(--champagne); margin-bottom: 34px;
  }
  h1 {
    font-weight: 800; font-size: clamp(34px, 6vw, 72px); line-height: 1;
    letter-spacing: -.035em; text-transform: uppercase; margin-bottom: 24px;
  }
  h1 em {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    text-transform: none; letter-spacing: 0; color: var(--champagne); display: block; margin-top: 14px;
  }
  p { color: var(--stone); font-size: 16px; margin-bottom: 40px; }
  a {
    display: inline-block; text-decoration: none; color: var(--black);
    background: var(--champagne); padding: 17px 32px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .26em; text-transform: uppercase;
    transition: background .4s cubic-bezier(.22,.61,.36,1);
  }
  a:hover, a:focus-visible { background: #D8B98F; }
  a:focus-visible { outline: 2px solid var(--champagne); outline-offset: 4px; }
